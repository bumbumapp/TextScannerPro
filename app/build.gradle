plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.bumbumapps.studytextscan'
    compileSdk 36

    defaultConfig {
        applicationId "com.bumbumapps.textscannerpro"
        minSdk 24
        targetSdk 36
        // Play: versionCode 7 is live.
        versionCode 8
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    splits {
        // Configures multiple APKs based on ABI.
        abi {
            // Enables building multiple APKs per ABI.
            enable true

            // By default all ABIs are included, so use reset() and include to specify that we only
            // want APKs for x86, armeabi-v7a, and mips.
            reset()

            // Specifies a list of ABIs that Gradle should create APKs for.
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"

            // Specifies that we want to also generate a universal APK that includes all ABIs.
            universalApk true
        }
    }
    buildTypes {
        debug {
            // Google test ads in debug builds.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "admob_banner_id", "ca-app-pub-3940256099942544/9214589741"
            resValue "string", "admob_interstitial_id", "ca-app-pub-3940256099942544/1033173712"
        }
        release {
            manifestPlaceholders = [admobAppId: "ca-app-pub-8444865753152507~6647722997"]
            resValue "string", "admob_banner_id", "ca-app-pub-8444865753152507/1551045653"
            resValue "string", "admob_interstitial_id", "ca-app-pub-8444865753152507/5705396162"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }

    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation "io.coil-kt:coil:2.7.0"

    // To recognize Latin script
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // To recognize Chinese script
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    // To recognize Devanagari script
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
    // To recognize Japanese script
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    // To recognize Korean script
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    //navigation
    def nav_version = "2.9.5"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    //to fix Pending Intent flag, we dont even use workManager, yaaay android
    implementation 'androidx.work:work-runtime-ktx:2.10.5'

    //lottie animations
    def lottie_version = "6.6.7"
    implementation "com.airbnb.android:lottie:$lottie_version"

    //jetpack preferences datastore (sharedPrefs)
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.datastore:datastore-core:1.1.7'

    //room database
    def room_version = "2.7.2"
    implementation "androidx.room:room-runtime:$room_version"
    // Room on KSP, Epoxy on kapt: their bundled room-compiler-processing versions clash on one kapt classpath.
    ksp "androidx.room:room-compiler:$room_version"
    // optional - Kotlin Extensions and Coroutines support for Room
    implementation "androidx.room:room-ktx:$room_version"

    // Koin main features for Android (Scope,ViewModel ...)
    implementation "io.insert-koin:koin-android:3.5.6"
    // Koin core features
    implementation "io.insert-koin:koin-core:3.5.6"

    //epoxy
    def epoxyVersion = "5.1.4"
    implementation "com.airbnb.android:epoxy:$epoxyVersion"
    // Add the annotation processor if you are using Epoxy's annotations (recommended)
    kapt "com.airbnb.android:epoxy-processor:$epoxyVersion"

    //entity extraction - text recognition
    //implementation 'com.google.mlkit:entity-extraction:16.0.0-beta2'

    //Google ML-kit Task extensions
    //Source: https://github.com/Kotlin/kotlinx.coroutines/tree/master/integration/kotlinx-coroutines-play-services
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'

    //image cropper
    implementation 'com.github.CanHub:Android-Image-Cropper:4.1.0'

    //COMPOSE
    // When using a MDC theme
    implementation 'androidx.compose.material:material:1.9.4'
    implementation 'androidx.compose.foundation:foundation:1.9.4'
    implementation 'androidx.compose.ui:ui:1.9.4'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.9.4'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.9.4'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation "br.com.devsrsouza.compose.icons.android:line-awesome:1.0.0"

    //ads
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation platform('com.google.firebase:firebase-bom:34.4.0')

    // Add the dependencies for the Crashlytics and Analytics libraries
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation 'com.google.firebase:firebase-crashlytics'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
